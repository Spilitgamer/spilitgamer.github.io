function loadQuestion(){
  answered=false;
  let q=quizData[index];
  document.getElementById("question").innerText=(index+1)+". "+q.q;

  let options=[q.a,...q.o].sort(()=>Math.random()-0.5);

  document.getElementById("options").innerHTML=
    options.map(opt=>`<div class="option" onclick="checkAnswer(this,'${q.a}')">${opt}</div>`).join("");
}

function checkAnswer(el,ans){
  if(answered) return;
  answered=true;

  let opts=document.querySelectorAll(".option");
  opts.forEach(o=>{
    if(o.innerText===ans) o.classList.add("correct");
    else o.classList.add("wrong");
  });

  if(el.innerText===ans) correct++;
  else wrong++;

  document.getElementById("scoreBox").innerText="Correct: "+correct+" | Wrong: "+wrong;
}

function nextQuestion(){
  if(!answered) return;

  index++;
  if(index<quizData.length){
    loadQuestion();
  } else {
    document.getElementById("quiz").innerHTML=
    "<h2>🎉 Congratulations! You completed all quizzes!</h2>";
    document.querySelector(".next-btn").style.display="none";
  }
}
