<!DOCTYPE html>
<html>
<head>
  <title>Login System</title>
</head>
<body>

<h2>Login Page</h2>

<button onclick="googleLogin()">Login with Google</button>
<button onclick="logout()">Logout</button>

<p id="user"></p>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBHy6cOAEX4Nd_qjYLInxMjkfSYgWL3QD8",
  authDomain: "spilit-login.firebaseapp.com",
  projectId: "spilit-login",
  storageBucket: "spilit-login.firebasestorage.app",
  messagingSenderId: "326197790699",
  appId: "1:326197790699:web:33e553b65b3f19a9e63bae",
  measurementId: "G-F1W6WMBWNH"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
</script>

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Google Login
function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(result => {
      document.getElementById("user").innerText =
        "Welcome: " + result.user.displayName;
    })
    .catch(error => alert(error.message));
}

// Logout
function logout() {
  auth.signOut().then(() => {
    document.getElementById("user").innerText = "Logged out";
  });
}

// Check login state
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("user").innerText =
      "Already Logged in: " + user.displayName;
  }
});
</script>

</body>
</html>
