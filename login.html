<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>  <style>
    body{
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box{
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2{
      margin-bottom: 20px;
    }

    button{
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .google{
      background: #db4437;
      color: white;
    }

    .logout{
      background: #475569;
      color: white;
    }

    #user{
      margin-top: 15px;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style></head>
<body>  <div class="box">
    <h2>Login</h2><button class="google" onclick="googleLogin()">Login with Google</button>
<button class="logout" onclick="logout()">Logout</button>

<p id="user">Not logged in</p>

  </div>  <!-- Firebase SDK -->  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>  
  <script>

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ✅ Google Login
    function googleLogin(){
      const provider = new firebase.auth.GoogleAuthProvider();

      auth.signInWithPopup(provider)
        .then((result) => {
          document.getElementById("user").innerText = 
            "Welcome: " + result.user.displayName;
        })
        .catch((error) => {
          console.log(error);
          alert(error.message);
        });
    }

    // ✅ Logout
    function logout(){
      auth.signOut().then(() => {
        document.getElementById("user").innerText = "Not logged in";
      });
    }

    // ✅ Check login state
    auth.onAuthStateChanged((user) => {
      if(user){
        document.getElementById("user").innerText = 
          "Logged in as: " + user.displayName;
      }
    });
  </script>
