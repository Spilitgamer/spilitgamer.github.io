<div class="container">

<h2 class="site-name">Spilitgamer</h2>
<h1>User Reviews</h1>

<input type="text" id="name" placeholder="Your Name">
<textarea id="review" placeholder="Write your review..."></textarea>

<div class="stars" id="stars">
    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
</div>

<button class="submit-btn" onclick="submitReview()">Submit Review</button>

<div id="reviews"></div>

</div>

<script>
let selectedRating = 0;
const stars = document.querySelectorAll("#stars span");

let currentUser = localStorage.getItem("userEmail") || "guest";
const ownerPassword = "Spilitthethegoatt1234#$";

window.onload = displayReviews;

// ⭐ STAR
stars.forEach((star, index) => {
    star.addEventListener("click", () => {
        selectedRating = index + 1;
        stars.forEach(s => s.classList.remove("active"));
        for (let i = 0; i < selectedRating; i++) {
            stars[i].classList.add("active");
        }
    });
});



// 🟢 SUBMIT REVIEW
function submitReview() {
    const name = document.getElementById("name").value;
    const review = document.getElementById("review").value;

    if (!name || !review || selectedRating === 0) {
        alert("Fill all fields!");
        return;
    }

    currentUser = name;
    localStorage.setItem("userEmail", currentUser);

    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    reviews.unshift({
        id: Date.now(),
        name,
        review,
        rating: selectedRating,
        likes: [],
        replies: []
    });

    localStorage.setItem("reviews", JSON.stringify(reviews));
    displayReviews();

    document.getElementById("name").value = "";
    document.getElementById("review").value = "";
    selectedRating = 0;
    stars.forEach(s => s.classList.remove("active"));
}

// 🟢 DISPLAY
function displayReviews() {
    const container = document.getElementById("reviews");
    container.innerHTML = "";

    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    reviews.forEach((r) => {

        let liked = r.likes.includes(currentUser);

        const box = document.createElement("div");
        box.classList.add("review-box");

        box.innerHTML = `
            <h3>${r.name}</h3>
            <div class="rating">${"★".repeat(r.rating)}</div>
            <p>${r.review}</p>

            <div class="actions">
                <button class="like-btn" onclick="likeReview(${r.id})">
                    ${liked ? "💖 Liked" : "👍 Like"} (${r.likes.length})
                </button>

                <button class="reply-btn" onclick="showReplyInput(${r.id})">
                    💬 Reply
                </button>

                <button class="delete-btn" onclick="deleteReview(${r.id})">
                    ❌ Delete
                </button>
            </div>

            <div class="reply-box">
                ${r.replies.map(rep => `<div class="reply">💬 ${rep}</div>`).join("")}
                <div id="replyArea_${r.id}"></div>
            </div>
        `;

        container.appendChild(box);
    });
}

// 💖 LIKE SYSTEM
function likeReview(id) {
    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    let review = reviews.find(r => r.id === id);
    let i = review.likes.indexOf(currentUser);

    if (i === -1) review.likes.push(currentUser);
    else review.likes.splice(i, 1);

    localStorage.setItem("reviews", JSON.stringify(reviews));
    displayReviews();
}

// 💬 SHOW REPLY INPUT
function showReplyInput(id) {
    let area = document.getElementById("replyArea_" + id);

    area.innerHTML = `
        <input class="reply-input" id="input_${id}" placeholder="Write reply...">
        <button onclick="addReply(${id})">Send</button>
    `;
}

// 💬 ADD REPLY
function addReply(id) {
    let input = document.getElementById("input_" + id);
    let text = input.value;

    if (!text) return;

    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
    let review = reviews.find(r => r.id === id);

    review.replies.push(currentUser + ": " + text);

    localStorage.setItem("reviews", JSON.stringify(reviews));
    displayReviews();
}

// ❌ DELETE
function deleteReview(id) {
    let pass = prompt("Enter owner password:");

    if (pass === ownerPassword) {
        let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
        reviews = reviews.filter(r => r.id !== id);
        localStorage.setItem("reviews", JSON.stringify(reviews));
        displayReviews();
    } else {
        alert("Wrong password!");
    }
}
</script>
