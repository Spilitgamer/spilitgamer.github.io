<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050816;
  color:white;
  overflow-x:hidden;
}

/* PARTICLES */
#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:15px;
  padding:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

nav a{
  color:white;
  text-decoration:none;
  padding:8px 14px;
  border-radius:8px;
  transition:0.3s;
}

nav a:hover{
  background:#38bdf8;
  color:black;
}

/* HEADER TITLE */
header{
  text-align:center;
  padding:40px 20px;
}

header h1{
  color:white;
  font-size:40px;
}

/* CONTACT BOX */
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
  text-align:center;
}

input,textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  outline:none;
  background:white;
  color:black;
}

textarea{
  height:150px;
  resize:none;
}

/* BUTTON */
button{
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#38bdf8;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px #38bdf8;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  margin-top:40px;
  background:rgba(0,0,0,0.6);
  border-top:1px solid #1f2937;
}

footer a{
  color:#38bdf8;
  text-decoration:none;
}
 /* Menu icon */
.menu-icon {
  font-size: 28px;
  cursor: pointer;
  padding: 10px;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 1000;
  text-align: center;
  color: white;
}

/* Side menu */
.side-menu {
  width: 0;
  height: 100%;
  background-color: #111;
  position: fixed;
  top: 0;
  left: 0;
  overflow-x: hidden;
  transition: 0.4s;
  padding-top: 60px;
  z-index: 999;
  text-align: center;
}

/* Links */
.side-menu a {
  display: block;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
}

.side-menu a:hover {
  background-color: #575757;
  body {
  background: linear-gradient(-45deg, #0f0f0f, #001f1f, #000000, #002626);
  background-size: 400% 400%;
  animation: bgAnimation 10s infinite alternate;
  color: white;
  text-align: center;
}
</style>
</style>
</head>

<body>
       <!-- Menu Icon -->
<div class="menu-icon" onclick="toggleMenu()">

</div>

<!-- NAV -->
<nav>

</nav>

<!-- HEADER -->
<header>
<h1>Contact Us 📩</h1>
<p>Send us your feedback, ideas or collaboration request</p>
</header>

<!-- CONTACT FORM -->
<div class="container">
<form action="https://formspree.io/f/mvzvbpvy" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>

<script>
particlesJS("particles-js",{
  particles:{
    number:{value:60},
    color:{value:"#38bdf8"},
    size:{value:2},
    move:{speed:1.5}
  }
});
</script>
 <script>
function toggleMenu() {
  let menu = document.getElementById("sideMenu");

  if (menu.style.width === "200px") {
    menu.style.width = "0";
  } else {
    menu.style.width = "200px";
  }
}
</script>
